name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/BudsTray.Tests -c Debug

      - name: Publish self-contained single-file exe
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish BudsTray.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$version -o publish
          (Get-FileHash publish/BudsTray.exe -Algorithm SHA256).Hash.ToLower() + '  BudsTray.exe' |
            Out-File -Encoding ascii publish/BudsTray.exe.sha256

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' publish/BudsTray.exe publish/BudsTray.exe.sha256 `
            --title 'BudsTray ${{ github.ref_name }}' `
            --notes 'Windows 10/11 x64. Download **BudsTray.exe** and run it; see the README for setup. Check the download against BudsTray.exe.sha256.'
