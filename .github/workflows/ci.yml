name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Release)
        run: dotnet build BudsTray.csproj -c Release

      - name: Build (Debug, with developer switches)
        run: dotnet build BudsTray.csproj -c Debug

      - name: Test
        run: dotnet test tests/BudsTray.Tests -c Debug
